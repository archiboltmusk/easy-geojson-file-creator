name: Validate ward data

on:
  pull_request:
    paths:
      - "data/**"
      - "schema/**"
      - "scripts/validate-data.mjs"
      - "scripts/__tests__/**"
      - ".github/workflows/validate-data.yml"
  push:
    branches: [main]
    paths:
      - "data/**"
      - "schema/**"
      - "scripts/validate-data.mjs"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test validator
        run: pnpm data:test
      - name: Validate data/
        run: pnpm data:validate
